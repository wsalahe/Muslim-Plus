name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['catalog.json', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.27.4', channel: stable}
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64,android-arm
      - run: |
          cp build/app/outputs/flutter-apk/app-release.apk QuranKareem.apk
          gh release delete app-unsigned -y --cleanup-tag || true
          gh release create app-unsigned QuranKareem.apk --title "القرآن الكريم" --notes "Latest app build ${GITHUB_SHA::7}"
        env:
          GH_TOKEN: ${{ github.token }}
