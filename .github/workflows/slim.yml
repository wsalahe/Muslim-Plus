name: Build slim arm64 APK
on:
  push:
    branches: [main]
    paths-ignore: ['catalog.json', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.27.4', channel: stable}
      - run: |
          # slim variant: drop the duplicate in-app Adhan preview files (the native alarm keeps its own copies in res/raw)
          sed -i '/assets\/adhan\//d' pubspec.yaml
          rm -rf assets/adhan
      - run: flutter pub get
      - run: |
          for i in 1 2 3; do flutter build apk --release --target-platform android-arm64 && break; sleep 20; done
          test -f build/app/outputs/flutter-apk/app-release.apk
      - run: |
          cp build/app/outputs/flutter-apk/app-release.apk QuranKareem-arm64.apk
          ls -l QuranKareem-arm64.apk
          gh release delete app-arm64 -y --cleanup-tag || true
          gh release create app-arm64 QuranKareem-arm64.apk --title "Muslim Plus arm64" --notes "Slim arm64 build ${GITHUB_SHA::7}"
        env:
          GH_TOKEN: ${{ github.token }}
