name: quran_app
description: Muslim Plus
publish_to: none
version: 1.17.0+19
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  video_player: ^2.8.0
  url_launcher: ^6.2.0
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  geolocator: ^13.0.1
  flutter_compass: ^0.8.1
  adhan: ^2.0.0+1
  hijri: ^3.0.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  open_filex: ^5.0.0
  file_picker: ^8.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/catalog.json
    - assets/reciters.json
    - assets/quran.json
    - assets/adhkar.json
    - assets/adhan/
    - assets/pages.json
    - assets/cities.txt
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#082044"
  adaptive_icon_foreground: assets/icon_fg.png
